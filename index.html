let lt=performance.now();const f=now=>{now=now||lt;const k=Math.min(3,Math.max(.5,(now-lt)/16.667));lt=now;x.clearRect(0,0,w,h);for(const p of ps){p.vx=Math.max(-1.45,Math.min(1.45,p.vx+(Math.random()-.5)*.05*k));p.vy=Math.max(-1.45,Math.min(1.45,p.vy+(Math.random()-.5)*.05*k));p.x+=p.vx*k;p.y+=p.vy*k;if((p.x<p.r&&p.vx<0)||(p.x>w-p.r&&p.vx>0)){p.vx*=-1;hit(p)}if((p.y<p.r&&p.vy<0)||(p.y>h-p.r&&p.vy>0)){p.vy*=-1;hit(p)}x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}raf=requestAnimationFrame(f)};f()}
const V={
setup(){fixc();
let h='<h1 class=c style="font-weight:900;-webkit-text-stroke:2px #fff;letter-spacing:.3em;padding-left:.3em;font-size:38px;margin:40px 0 32px">VARALICA</h1><div class=row>'+bt('Reči',S.mode=='w',"S.mode='w';go('setup')")+bt('Pitanja',S.mode=='q',"S.mode='q';go('setup')")+'</div>';
h+=sp('Broj igrača','n',S.n)+'<details'+(S.dt?' open':'')+' ontoggle="S.dt=this.open"><summary class=mu>Imena igrača (opciono)</summary>';
for(let i=0;i<S.n;i++)h+=`<input type=text placeholder="Igrač ${i+1}" value="${(S.names[i]||'').replace(/"/g,'&quot;')}" onchange="S.names[${i}]=this.value">`;
h+='</details><h2>Broj impostera</h2><div class=row>'+bt('Fiksno',S.t=='fix',"S.t='fix';go('setup')")+bt('Raspon',S.t=='rng',"S.t='rng';go('setup')")+'</div>';
if(S.t=='fix')h+=sp('Imposteri','fix',S.fix);
else{h+=sp('Minimum','min',S.min)+sp('Maksimum','max',S.max)+'<p class=mu>Šansa za svaki broj (zbir je 100%):</p>';
const P=pcts();
for(let c=S.min;c<=S.max;c++)h+=`<div class=row><span>${c} ${c==1?'IMPOSTER':'IMPOSTERA'}</span><span style="display:flex;align-items:center;gap:6px"><button class=s onclick="setp(${c},${P[c]-5})">−</button><span class=pc><input type=number inputmode=numeric min=0 max=100 step=1 value=${P[c]} onchange="setp(${c},this.value)">%</span><button class=s onclick="setp(${c},${P[c]+5})">+</button></span></div>`}
h+='<h2>Kategorije</h2><div class=row>'+bt('Selektuj sve',false,"S.cats=Object.keys(D);go('setup')")+bt('Odselektuj sve',false,"S.cats=[];go('setup')")+'</div><div class=chips>'+Object.keys(D).map(c=>`<label><input type=checkbox ${S.cats.includes(c)?'checked':''} onchange="tc('${c}')">${c}</label>`).join('')+'</div><h2>Podešavanja</h2>';
h+=S.mode=='w'?ck('Imposter vidi kategoriju','cw'):ck('Imposter zna da je imposter','qk')+ck('Prikaži kategoriju svima','qc');
h+=sp('Tajmer diskusije','timer',S.timer?Math.floor(S.timer/60)+':'+String(S.timer%60).padStart(2,'0'):'isklj.',15);
return h+'<button style="margin-top:20px" onclick="start()">Počni igru</button>'},
pass(){return `<div class=big>${nm(R.i)}</div><p class="mu c">Uzmi telefon i pritisni dugme kad si spreman. Ostali ne gledaju!</p><button onclick="go('show')">Spreman</button>`},
show(){const imp=R.imps.has(R.i);let b;
if(S.mode=='w')b=imp?'<div class=big style="font-size:32px"><b>!!! IMPOSTER !!!</b></div>'+(S.cw?`<p class=c>Kategorija:<br><br><span class=tag style="margin:0">${R.cat}</span></p>`:''):`<div class=big style="text-transform:uppercase">${R.word}</div>`;
else b=(imp&&S.qk?'<p class=c><b>Ti si IMPOSTER</b></p>':'')+(S.qc?`<p class="mu c">Kategorija: ${R.cat}</p>`:'')+`<div class=big style="font-size:28px">${R.q[imp?1:0]}</div>`;
CT=b;rv=false;busy=0;return `<div class=mid><div class=pn>${nm(R.i)}</div><div class=box id=bx onclick="tgl()"><canvas id=cv></canvas><div class=bt id=bt>${hint()}</div></div><button id=nx style="visibility:hidden;opacity:0;transition:opacity .9s ease" onclick="R.i++;go(R.i<S.n?'show':'talk')">${R.i<S.n-1?'Sakrij i dodaj sledećem':'Sakrij i počni diskusiju'}</button></div>`},
talk(){return `<h1 class=c>Diskusija</h1><p class=c>Počinje: <b>${nm(R.st)}</b></p><p class="mu c">${S.mode=='w'?'Svako redom kaže jednu reč-asocijaciju (dva kruga), zatim rasprava i glasanje.':'Svako redom glasno odgovara na svoje pitanje, zatim rasprava ko je imao drugačije pitanje.'}</p>${S.timer?'<div class=big id=tm></div>':''}<button onclick="go('end')">Otkrij impostere</button>`},
end(){const im=[...R.imps].map(nm).join(', ');
return `<h1 class=c>Rezultat</h1><p class=c>Imposter: <b>${im}</b></p>`+(S.mode=='w'?`<div class=big style="text-transform:uppercase">${R.word}</div>`:`<p class=c>Pitanje igrača:<br><b>${R.q[0]}</b></p><p class=c>Pitanje impostera:<br><b>${R.q[1]}</b></p>`)+`<button onclick="start()">Nova runda</button><button class=o onclick="go('setup')">Glavni meni</button>`}
};
function start(){if(!S.cats.length){alert('Izaberi bar jednu kategoriju');return}
const c=S.t=='fix'?S.fix:pick(),cat=S.cats[rnd(S.cats.length)];
R={imps:new Set(shuf([...Array(S.n).keys()]).slice(0,c)),i:0,cat,st:rnd(S.n)};
if(S.mode=='w')R.word=D[cat].w[rnd(D[cat].w.length)];else R.q=D[cat].q[rnd(D[cat].q.length)];
go('show')}
function go(s){const ch=s!=scr;scr=s;clearInterval(tm);$('hm').style.display=s=='setup'?'none':'block';cancelAnimationFrame(raf);$('app').innerHTML=V[s]();if(s=='show')anim();if(ch)window.scrollTo(0,0);
if(s=='talk'&&S.timer){let t=S.timer;const f=()=>{const e=$('tm');if(e)e.textContent=t>0?Math.floor(t/60)+':'+String(t%60).padStart(2,'0'):'Vreme!'};f();tm=setInterval(()=>{if(t>0)t--;f()},1000)}}
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
go('setup');
</script></body></html>
